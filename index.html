<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"> <title>Night Shift</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; } body { background: #000; color: white; font-family: Arial, sans-serif; overflow: hidden; } #game { position: relative; width: 100vw; height: 100vh; background: #111; overflow: hidden; } /* ESCRITÓRIO */ #office { position: absolute; inset: 0; background: linear-gradient(#171717 0%, #090909 55%, #020202 100%); } .wall { position: absolute; inset: 0 0 38% 0; background: repeating-linear-gradient( 90deg, #171717 0px, #171717 55px, #111 56px, #111 110px ); } .floor { position: absolute; bottom: 0; width: 100%; height: 38%; background: repeating-linear-gradient( 45deg, #151515 0, #151515 35px, #0c0c0c 36px, #0c0c0c 70px ); transform: perspective(300px) rotateX(35deg); transform-origin: bottom; } .desk { position: absolute; width: 55%; height: 17%; left: 22.5%; bottom: 13%; background: #151515; border: 4px solid #252525; box-shadow: 0 0 30px #000; } .monitor { position: absolute; width: 25%; height: 25%; left: 37.5%; bottom: 27%; background: #050505; border: 5px solid #292929; box-shadow: 0 0 20px #000; } .monitor::after { content: "SYSTEM OFFLINE"; position: absolute; color: #333; font-size: 10px; left: 20%; top: 45%; } .hall { position: absolute; top: 12%; width: 20%; height: 62%; background: #020202; border: 5px solid #151515; } .leftHall { left: 0; } .rightHall { right: 0; } .light { position: absolute; width: 100%; height: 100%; background: radial-gradient( ellipse, rgba(220,220,170,.18), transparent 70% ); opacity: 0; pointer-events: none; } .door { position: absolute; top: 0; width: 100%; height: 100%; background: repeating-linear-gradient( #292929 0, #292929 15px, #111 16px, #111 30px ); transform: translateY(-100%); transition: transform .35s; z-index: 5; } .door.closed { transform: translateY(0); } .control { position: absolute; width: 70px; height: 120px; top: 42%; background: #111; border: 2px solid #333; z-index: 10; text-align: center; padding-top: 10px; } .control.left { left: 21%; } .control.right { right: 21%; } .control button { display: block; width: 52px; height: 42px; margin: 6px auto; background: #181818; border: 2px solid #555; color: white; cursor: pointer; } .control button.active { background: #7b1111; border-color: red; } .lightOn { opacity: 1; } /* HUD */ #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 100; font-weight: bold; text-shadow: 0 0 5px #000; } #power { color: #69ff69; } #night { font-size: 20px; } #time { font-size: 25px; } /* CÂMERAS */ #cameraButton { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 150; padding: 15px 30px; background: #222; color: white; border: 2px solid #777; font-weight: bold; cursor: pointer; } #cameraPanel { display: none; position: absolute; inset: 0; z-index: 120; background: rgba(0,0,0,.95); } #cameraPanel.open { display: block; } .cameraView { position: absolute; left: 5%; top: 7%; width: 65%; height: 72%; background: radial-gradient(circle at 50% 45%, #303030, #050505 70%); border: 4px solid #444; overflow: hidden; } .cameraNoise { position: absolute; inset: 0; opacity: .16; background-image: repeating-linear-gradient( 0deg, transparent, transparent 3px, white 4px ); animation: noise .08s infinite; } @keyframes noise { 0% { transform: translateY(0); } 50% { transform: translateY(4px); } 100% { transform: translateY(-4px); } } #camTitle { position: absolute; top: 15px; left: 15px; font-size: 24px; z-index: 3; } #camDescription { position: absolute; bottom: 20px; left: 20px; color: #aaa; z-index: 3; } .camButtons { position: absolute; right: 5%; top: 10%; width: 25%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .camButtons button { padding: 15px 5px; background: #181818; color: white; border: 2px solid #555; cursor: pointer; } .camButtons button:hover { background: #333; } #closeCam { position: absolute; bottom: 10%; right: 7%; padding: 15px 25px; background: #6d1111; color: white; border: 2px solid #a33; } /* INIMIGO */ .enemy { position: absolute; width: 100px; height: 180px; left: 50%; top: 30%; transform: translateX(-50%); display: none; } .enemy.show { display: block; } .head { position: absolute; width: 90px; height: 90px; border-radius: 45%; left: 5px; top: 0; background: #353535; box-shadow: 0 0 30px #000; } .eye { position: absolute; width: 17px; height: 17px; border-radius: 50%; background: #e33; top: 32px; } .eye.left { left: 20px; } .eye.right { right: 20px; } .mouth { position: absolute; width: 55px; height: 25px; border-bottom: 6px solid #000; left: 18px; top: 54px; } .body { position: absolute; width: 70px; height: 90px; left: 15px; top: 82px; background: #222; } /* GAME OVER */ #gameOver, #winScreen { position: absolute; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; flex-direction: column; background: #000; } #gameOver.show, #winScreen.show { display: flex; } #jumpscare { position: absolute; inset: 0; background: #160000; display: none; z-index: 600; align-items: center; justify-content: center; } #jumpscare.show { display: flex; animation: shake .05s infinite; } .scareFace { width: 65vw; height: 65vw; max-width: 500px; max-height: 500px; border-radius: 45%; background: #555; position: relative; box-shadow: 0 0 100px red; } .scareFace::before, .scareFace::after { content: ""; position: absolute; width: 25%; height: 25%; top: 25%; background: red; border-radius: 50%; } .scareFace::before { left: 15%; } .scareFace::after { right: 15%; } .scareMouth { position: absolute; width: 70%; height: 25%; left: 15%; bottom: 15%; background: #000; border: 8px solid #222; } @keyframes shake { 0% { transform: translate(0); } 25% { transform: translate(10px,-10px); } 50% { transform: translate(-10px,10px); } 75% { transform: translate(8px,8px); } 100% { transform: translate(-8px,-8px); } } h1 { font-size: 45px; margin-bottom: 20px; } .restart { padding: 15px 30px; background: #222; border: 2px solid #777; color: white; cursor: pointer; font-size: 18px; } /* MOBILE */ @media(max-width:700px) { .control { width: 55px; height: 100px; } .control button { width: 42px; height: 32px; font-size: 9px; } .control.left { left: 19%; } .control.right { right: 19%; } .cameraView { width: 70%; height: 65%; left: 3%; } .camButtons { right: 3%; width: 23%; } .camButtons button { font-size: 10px; padding: 12px 2px; } h1 { font-size: 32px; } } </style> </head> <body> <div id="game"> <div id="office"> <div class="wall"></div> <div class="floor"></div> <div class="hall leftHall"> <div id="leftLight" class="light"></div> <div id="leftDoor" class="door"></div> </div> <div class="hall rightHall"> <div id="rightLight" class="light"></div> <div id="rightDoor" class="door"></div> </div> <div class="desk"></div> <div class="monitor"></div> <div class="control left"> <div>ESQ</div> <button onclick="toggleDoor('left')">PORTA</button> <button onclick="toggleLight('left')">LUZ</button> </div> <div class="control right"> <div>DIR</div> <button onclick="toggleDoor('right')">PORTA</button> <button onclick="toggleLight('right')">LUZ</button> </div> </div> <div id="hud"> <div> <div>ENERGIA: <span id="power">100%</span></div> <div id="usage">USO: ▮</div> </div> <div id="night">NOITE 1</div> <div id="time">12 AM</div> </div> <button id="cameraButton" onclick="openCameras()"> 📹 CÂMERAS </button> <!-- CÂMERAS --> <div id="cameraPanel"> <div class="cameraView"> <div id="camTitle">CAM 1 — SALÃO</div> <div id="camDescription"> Nada parece estar se movendo... </div> <div id="cameraEnemy" class="enemy"> <div class="head"> <div class="eye left"></div> <div class="eye right"></div> <div class="mouth"></div> </div> <div class="body"></div> </div> <div class="cameraNoise"></div> </div> <div class="camButtons"> <button onclick="changeCam(1)">CAM 1</button> <button onclick="changeCam(2)">CAM 2</button> <button onclick="changeCam(3)">CAM 3</button> <button onclick="changeCam(4)">CAM 4</button> <button onclick="changeCam(5)">CAM 5</button> <button onclick="changeCam(6)">CAM 6</button> </div> <button id="closeCam" onclick="closeCameras()"> FECHAR </button> </div> <!-- JUMPSCARE --> <div id="jumpscare"> <div class="scareFace"> <div class="scareMouth"></div> </div> </div> <!-- GAME OVER --> <div id="gameOver"> <h1>VOCÊ MORREU</h1> <p>O turno terminou de forma inesperada.</p> <br> <button class="restart" onclick="location.reload()"> TENTAR NOVAMENTE </button> </div> <!-- VITÓRIA --> <div id="winScreen"> <h1>6 AM</h1> <p>Você sobreviveu à noite!</p> <br> <button class="restart" onclick="location.reload()"> JOGAR NOVAMENTE </button> </div> </div> <script> /* ========================= CONFIGURAÇÕES ========================= */ let power = 100; let hour = 0; let gameOver = false; let camerasOpen = false; let currentCam = 1; let doors = { left: false, right: false }; let lights = { left: false, right: false }; /* O inimigo possui uma posição. Quanto maior, mais perto do jogador. */ let enemyPosition = 0; /* ========================= ELEMENTOS ========================= */ const powerText = document.getElementById("power"); const timeText = document.getElementById("time"); const usageText = document.getElementById("usage"); const leftDoor = document.getElementById("leftDoor"); const rightDoor = document.getElementById("rightDoor"); const leftLight = document.getElementById("leftLight"); const rightLight = document.getElementById("rightLight"); const cameraPanel = document.getElementById("cameraPanel"); const cameraEnemy = document.getElementById("cameraEnemy"); const camTitle = document.getElementById("camTitle"); const camDescription = document.getElementById("camDescription"); /* ========================= PORTAS ========================= */ function toggleDoor(side) { if (gameOver || power <= 0) return; doors[side] = !doors[side]; if (side === "left") { leftDoor.classList.toggle("closed", doors.left); } if (side === "right") { rightDoor.classList.toggle("closed", doors.right); } updateUsage(); } /* ========================= LUZES ========================= */ function toggleLight(side) { if (gameOver || power <= 0) return; lights[side] = !lights[side]; if (side === "left") { leftLight.classList.toggle("lightOn", lights.left); } if (side === "right") { rightLight.classList.toggle("lightOn", lights.right); } setTimeout(() => { lights[side] = false; if (side === "left") { leftLight.classList.remove("lightOn"); } if (side === "right") { rightLight.classList.remove("lightOn"); } }, 1800); updateUsage(); } /* ========================= USO DE ENERGIA ========================= */ function updateUsage() { let usage = 1; if (doors.left) usage++; if (doors.right) usage++; if (lights.left) usage++; if (lights.right) usage++; if (camerasOpen) usage++; usageText.textContent = "USO: " + "▮".repeat(Math.min(usage, 6)); } /* ========================= CÂMERAS ========================= */ function openCameras() { if (gameOver || power <= 0) return; camerasOpen = true; cameraPanel.classList.add("open"); updateCamera(); updateUsage(); } function closeCameras() { camerasOpen = false; cameraPanel.classList.remove("open"); updateUsage(); } function changeCam(number) { currentCam = number; updateCamera(); } function updateCamera() { camTitle.textContent = "CAM " + currentCam; const names = { 1: "SALÃO PRINCIPAL", 2: "CORREDOR ESQUERDO", 3: "CORREDOR DIREITO", 4: "DEPÓSITO", 5: "PALCO", 6: "SALA DOS FUNDOS" }; camTitle.textContent = "CAM " + currentCam + " — " + names[currentCam]; /* O inimigo aparece em determinadas câmeras dependendo de sua posição. */ let enemyCam = getEnemyCamera(); if (currentCam === enemyCam) { cameraEnemy.classList.add("show"); camDescription.textContent = "⚠️ ALGO ESTÁ AQUI."; } else { cameraEnemy.classList.remove("show"); camDescription.textContent = "Nenhum movimento detectado..."; } } function getEnemyCamera() { const route = [5, 1, 4, 2, 3]; return route[ Math.min(enemyPosition, route.length - 1) ]; } /* ========================= IA DO INIMIGO ========================= */ function moveEnemy() { if (gameOver) return; /* Existe uma chance do inimigo avançar. */ let chance = 0.35; if (Math.random() < chance) { enemyPosition++; /* Se chegou ao corredor esquerdo. */ if (enemyPosition >= 3) { attackPlayer(); return; } } if (camerasOpen) { updateCamera(); } } function attackPlayer() { /* Dependendo da rota, verifica qual porta protege o jogador. */ let attackingSide = Math.random() < 0.5 ? "left" : "right"; /* Se a porta estiver fechada, o inimigo recua. */ if (doors[attackingSide]) { enemyPosition = Math.max( 1, enemyPosition - 2 ); return; } /* Porta aberta = ataque. */ jumpscare(); } /* ========================= JUMPSCARE ========================= */ function jumpscare() { if (gameOver) return; gameOver = true; closeCameras(); document.getElementById( "jumpscare" ).classList.add("show"); setTimeout(() => { document.getElementById( "jumpscare" ).classList.remove("show"); document.getElementById( "gameOver" ).classList.add("show"); }, 1800); } /* ========================= ENERGIA ========================= */ function drainPower() { if (gameOver) return; let drain = 0.10; if (doors.left) drain += 0.08; if (doors.right) drain += 0.08; if (lights.left) drain += 0.04; if (lights.right) drain += 0.04; if (camerasOpen) drain += 0.05; power -= drain; power = Math.max(0, power); powerText.textContent = Math.floor(power) + "%"; updateUsage(); if (power <= 0) { doors.left = false; doors.right = false; leftDoor.classList.remove("closed"); rightDoor.classList.remove("closed"); lights.left = false; lights.right = false; leftLight.classList.remove("lightOn"); rightLight.classList.remove("lightOn"); /* Depois que a energia acaba, existe um pequeno tempo de suspense. */ setTimeout(() => { if (!gameOver) { jumpscare(); } }, 3500); } } /* ========================= RELÓGIO ========================= */ function updateTime() { if (gameOver) return; hour++; let displayHour; if (hour < 6) { displayHour = hour === 0 ? 12 : hour; } timeText.textContent = displayHour + " AM"; /* 6 AM = vitória */ if (hour >= 6) { gameOver = true; document.getElementById( "winScreen" ).classList.add("show"); } } /* ========================= LOOP DO JOGO ========================= */ /* A cada 5 segundos: - energia diminui - inimigo pode andar */ setInterval(() => { if (!gameOver) { drainPower(); moveEnemy(); } }, 5000); /* A cada 20 segundos passa aproximadamente 1 hora. */ setInterval(() => { if (!gameOver) { updateTime(); } }, 20000); /* ========================= TECLADO ========================= */ document.addEventListener("keydown", event => { if (event.key === "q") { toggleDoor("left"); } if (event.key === "a") { toggleLight("left"); } if (event.key === "e") { toggleDoor("right"); } if (event.key === "d") { toggleLight("right"); } if (event.key === " ") { if (camerasOpen) { closeCameras(); } else { openCameras(); } } }); /*
================> </body> </html>
